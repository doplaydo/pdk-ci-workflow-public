# Canonical pre-commit config for GDSFactory PDK repos.
#
# All hooks (PDK checks + third-party tools) are defined in pdk-ci-workflow-public.
# Versions of third-party tools are controlled centrally via
# additional_dependencies — no per-repo version pinning needed.
#
# CI: fetched automatically by the reusable test_code.yml workflow.
# Local: download via `make dev` or copy this file to your repo root.
#
# Per-hook overrides added to a PDK repo's local copy do NOT survive CI.
# test_code.yml overwrites the whole file with this canonical one and carries
# back only the top-level `exclude` — and `.pre-commit-config.yaml` is
# gitignored in the PDK repos anyway, so there is nothing to carry back in the
# usual case. A hook setting that has to hold in CI belongs here, centrally.

# Paths pre-commit must leave alone:
#
# - references/ holds vendor-supplied fixture data (netlists, blueprints, sim
#   output) that must stay byte-identical to the upstream source — pre-commit
#   hooks must not lint, reformat, or reject it.
# - *--sample-projects/<project>/build/ holds models.nyanlib and the SVG
#   symbols generated by the generate_nyanlib workflow and committed by its
#   regeneration PR; they are machine output, not source.
#
# Keep this a single-line regex: test_code.yml unions it with a repo-local
# exclude as `(?:canonical)|(?:local)`, and an inline `(?x)` flag would then
# no longer sit at the start of the combined pattern.
exclude: ^(references/|[^/]+--sample-projects/[^/]+/build/)

repos:
  - repo: https://github.com/doplaydo/pdk-ci-workflow-public
    rev: main
    hooks:
      # PDK structure validation
      - id: check-required-files
      - id: check-pyproject-sections
      - id: check-package-init
      - id: check-version-sync
      - id: check-cells-structure
      - id: check-tech-structure
      - id: check-pdk-object
      - id: check-test-structure
      - id: check-makefile-targets
      - id: check-workflows
      - id: check-multi-band
      - id: check-no-raw-layers
      - id: check-no-main-in-cells
      - id: check-precommit-config
      - id: check-template-drift
      - id: check-hook-freshness
      - id: check-uv-lock-tracked
      - id: check-uv-lock-sync
      # Code quality (versions controlled by pdk-ci-workflow-public)
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: ruff-lint
      - id: ruff-format
      - id: pydocstyle
      - id: nbstripout
      - id: codespell
      - id: pretty-format-toml
