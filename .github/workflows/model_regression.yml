name: Model Regression
on:
  workflow_call:
    inputs:
      enforce-model-jittability:
        description: Fail CI when a concrete model is not JAX JIT-traceable
        type: boolean
        default: false
    secrets:
      GFP_API_KEY:
        required: false
env:
  GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-model_regression
  cancel-in-progress: true
jobs:
  model-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: make install
      - name: Check model JAX jittability
        uses: doplaydo/pdk-ci-workflow-public/actions/check_model_jittability@main
        with:
          enforce: ${{ inputs.enforce-model-jittability }}
        continue-on-error: ${{ ! inputs.enforce-model-jittability }}
      - name: Run model regression tests
        env:
          PYTEST_ADDOPTS: "-k model --tb=short"
        run: |
          output=$(make test 2>&1) && exit 0
          # make wraps pytest exit-code 5 (no tests collected) into 2.
          # If every pytest invocation deselected all tests, treat as pass.
          if echo "$output" | grep -qE '/ 0 selected|no tests ran|\[0 items\]'; then
            echo "No model tests found — skipping"
            exit 0
          fi
          echo "$output"
          exit 1
      - name: Upload difftest artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: difftest-report-model_regression
          path: test_diffs/
          if-no-files-found: ignore
          retention-days: 3
