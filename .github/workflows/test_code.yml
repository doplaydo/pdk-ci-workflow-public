name: Test code

on:
  workflow_call:
    secrets:
      GFP_API_KEY:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-test_code
  cancel-in-progress: true

env:
  GFP_API_KEY: ${{ secrets.GFP_API_KEY }}

jobs:
  wheel-contents:
    name: Check wheel contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
      - name: Build wheel
        run: uv build --wheel --out-dir wheelhouse
      - name: Check wheel contents
        uses: doplaydo/pdk-ci-workflow-public/actions/check_wheel_contents@main
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
    - name: Fetch canonical pre-commit config
      run: |
        python3 -c "
        import yaml, os
        exclude = None
        try:
            with open('.pre-commit-config.yaml') as f:
                cfg = yaml.safe_load(f)
            if cfg and 'exclude' in cfg:
                exclude = cfg['exclude']
        except Exception:
            pass
        if exclude:
            with open('.repo-exclude', 'w') as f:
                f.write(exclude)
        " 2>/dev/null || true

        curl -fSL "https://raw.githubusercontent.com/doplaydo/pdk-ci-workflow-public/main/templates/.pre-commit-config.yaml" \
          -o .pre-commit-config.yaml

        if [ -f .repo-exclude ]; then
          python3 << 'PYEOF'
        import yaml
        with open('.repo-exclude') as f:
            repo_exclude = f.read().strip()
        with open('.pre-commit-config.yaml') as f:
            cfg = yaml.safe_load(f)
        # Union, don't replace: the canonical exclude carries fleet-wide
        # exemptions (references/, generated sample-project build/ output) that
        # a repo-local exclude must extend rather than silently drop.
        canonical = (cfg.get('exclude') or '').strip()
        cfg['exclude'] = f'(?:{canonical})|(?:{repo_exclude})' if canonical else repo_exclude
        with open('.pre-commit-config.yaml', 'w') as f:
            yaml.dump(cfg, f, default_flow_style=False, sort_keys=False)
        PYEOF
          rm .repo-exclude
        fi
    - name: Run pre-commit (no cache — rev uses mutable main branch)
      run: |
        pip install pre-commit
        pre-commit run --all-files
  test_code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install dependencies
        run: |
          make install
      # Line coverage rides along on this run of the suite. test_coverage.yml
      # and update_badges.yml download the coverage-xml artifact uploaded
      # below instead of running `make test` again.
      - name: Enable coverage
        id: cov
        run: |
          if ! uv run --no-sync python -c "import pytest_cov" 2>/dev/null; then
            echo "::warning::pytest-cov is not installed in the project environment; running the tests without coverage, so no coverage report is uploaded"
            exit 0
          fi
          pkg=$(uv run --no-sync python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              cfg = tomllib.load(f)
          module = cfg.get("tool", {}).get("gdsfactoryplus", {}).get("pdk", {}).get("name", "")
          print(module.split(".")[0] if module else "")
          PY
          )
          if [ -z "$pkg" ]; then
            echo "::warning::[tool.gdsfactoryplus.pdk].name is not set in pyproject.toml; running the tests without coverage, so no coverage report is uploaded"
            exit 0
          fi
          # --cov-append accumulates across Makefiles that run pytest several
          # times, so the coverage.xml left by the last run covers all of them.
          rm -f .coverage .coverage.* coverage.xml
          echo "PYTEST_ADDOPTS=${PYTEST_ADDOPTS:+$PYTEST_ADDOPTS }--cov=${pkg} --cov-report=xml --cov-append" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Test with pytest
        run: make test
      - name: Upload coverage report
        if: steps.cov.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
      - name: Upload difftest artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: difftest-report-test_code
          path: test_diffs/
          if-no-files-found: ignore
          retention-days: 3
  test_gfp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install dependencies
        run: |
          make install
      - name: Test with pytest
        run: uv run gfp test
      - name: Upload difftest artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: difftest-report-test_gfp
          path: test_diffs/
          if-no-files-found: ignore
          retention-days: 3
  test_gfp_no_dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install dependencies (no dev)
        run: uv sync --no-dev
      - name: Install gdsfactoryplus
        run: uv export --frozen --no-hashes | grep '^gdsfactoryplus' | xargs uv pip install
      - name: Test with gfp test (no dev deps)
        run: uv run --no-sync gfp test
      - name: Upload difftest artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: difftest-report-test_gfp_no_dev
          path: test_diffs/
          if-no-files-found: ignore
          retention-days: 3
