name: DRC Check
on:
  workflow_call:
    inputs:
      script_ref:
        description: Ref of this repo to download the helper scripts from.
        required: false
        type: string
        default: 'main'
    secrets:
      GFP_API_KEY:
        required: false
env:
  GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-drc
  cancel-in-progress: true
jobs:
  drc:
    name: DRC all_cells
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          # UV_LOCK_UNTRACKED repos resolve the private index from GFP_API_KEY.
          # The URL contains the organization id, so it cannot be committed.
          if grep -q '^UV_LOCK_UNTRACKED[[:space:]]*:=' Makefile 2>/dev/null; then
            index_env="$(make -s export-index)" || exit $?
            eval "$index_env"
            if [ -n "${UV_INDEX:-}" ]; then
              {
                echo "UV_INDEX<<EOF"
                echo "$UV_INDEX"
                echo "EOF"
                echo "UV_INDEX_GDSFACTORY_PLUS_USERNAME<<EOF"
                echo "$UV_INDEX_GDSFACTORY_PLUS_USERNAME"
                echo "EOF"
                echo "UV_INDEX_GDSFACTORY_PLUS_PASSWORD<<EOF"
                echo "$UV_INDEX_GDSFACTORY_PLUS_PASSWORD"
                echo "EOF"
              } >> "$GITHUB_ENV"
            fi
          fi
          uv sync --all-extras -P gdsfactoryplus
      - name: Configure gfp
        run: uv run gfp configure --api-key ${{ secrets.GFP_API_KEY }} --uv
      - name: Download helper scripts
        env:
          SCRIPT_REF: ${{ inputs.script_ref }}
        run: |
          for script in build_cell.py drc_project.py drc_delta.py; do
            curl -fsSL "https://raw.githubusercontent.com/doplaydo/pdk-ci-workflow-public/$SCRIPT_REF/scripts/$script" \
              -o "$script"
          done
      - name: Build cell
        run: |
          SKIP_ARGS=""
          SKIP_FILE=$(find . -name build_cell_skip.txt -not -path './.venv/*' -print -quit)
          if [ -n "$SKIP_FILE" ]; then
            SKIP_ARGS="--skip $(grep -v '^\s*#' "$SKIP_FILE" | grep -v '^\s*$' | tr '\n' ' ')"
          fi
          uv run python build_cell.py all_cells $SKIP_ARGS
      - id: drc-project
        name: Resolve DRC project
        shell: bash
        run: |
          # all_cells gets its own project so it never shares a deck with sample-project DRC.
          slug=$(uv run python drc_project.py --slug "ci-${GITHUB_REPOSITORY#*/}-all-cells")
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      - name: Run DRC
        shell: bash
        env:
          DRC_PROJECT: ${{ steps.drc-project.outputs.slug }}
        run: |
          mkdir -p build/lyrdb
          project=()
          if [ -n "$DRC_PROJECT" ]; then project=(--project "$DRC_PROJECT"); fi
          set +e
          uv run gfp check drc build/gds/all_cells.gds "${project[@]}" --outpath build/lyrdb/all_cells.lyrdb 2>&1 | tee build/drc.log
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${statuses[0]}" -ne 0 ]; then
            echo "::error::DRC command exited with code ${statuses[0]}. See build/drc.log in the drc-report artifact."
          fi
          if [ ! -s build/lyrdb/all_cells.lyrdb ]; then
            echo "::error::DRC produced no report; the violation count is unavailable."
            exit 1
          fi
          if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - name: Redact DRC log
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          api_key = os.environ.get("GFP_API_KEY", "").encode()
          log = Path("build/drc.log")
          if api_key and log.is_file():
              log.write_bytes(log.read_bytes().replace(api_key, b"***"))
          PY
      - name: Compare DRC against the base revision
        # A second full build and DRC, so the comment can say whether this pull
        # request adds or removes violations. The base run is allowed to fail:
        # the head result above is still the job's result. Forks can run this;
        # only the comment below needs write access.
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DRC_PROJECT: ${{ steps.drc-project.outputs.slug }}
        run: |
          set -euo pipefail
          head_dir="$RUNNER_TEMP/drc-head"
          base_dir="$RUNNER_TEMP/drc-base"
          mkdir -p "$head_dir" "$base_dir" build/drc-compare
          cp -a build/lyrdb/all_cells.lyrdb "$head_dir/" 2>/dev/null || true
          cp -a build/gds/all_cells.gds "$head_dir/" 2>/dev/null || true
          cp -a build/drc.log "$head_dir/" 2>/dev/null || true

          published=0
          publish() {
            if [ "$published" -eq 1 ]; then
              return 0
            fi
            published=1
            mkdir -p build/lyrdb build/gds build/drc-compare
            if [ -f "$base_dir/all_cells.lyrdb" ]; then
              cp "$base_dir/all_cells.lyrdb" build/drc-compare/all_cells_base.lyrdb
            fi
            if [ -f "$base_dir/all_cells.gds" ]; then
              cp "$base_dir/all_cells.gds" build/drc-compare/all_cells_base.gds
            fi
            if [ -f "$base_dir/drc.log" ]; then
              cp "$base_dir/drc.log" build/drc-compare/drc_base.log
            fi
            if [ -f "$head_dir/all_cells.lyrdb" ]; then
              cp "$head_dir/all_cells.lyrdb" build/lyrdb/all_cells.lyrdb
            fi
            if [ -f "$head_dir/all_cells.gds" ]; then
              cp "$head_dir/all_cells.gds" build/gds/all_cells.gds
            fi
            if [ -f "$head_dir/drc.log" ]; then
              cp "$head_dir/drc.log" build/drc.log
            fi
          }
          trap publish EXIT

          run_base() {
            # `|| return` so a base failure leaves the function instead of the
            # step. The caller turns errexit off around the call; do not turn
            # it back on in here, or a later failure skips the delta comment.
            git fetch --depth=1 origin "$BASE_SHA" || return 1
            git checkout -f "$BASE_SHA" || return 1
            rm -rf build
            uv sync --all-extras -P gdsfactoryplus || return 1
            uv run gfp configure --api-key "$GFP_API_KEY" --uv || return 1
            skip_args=""
            skip_file=$(find . -name build_cell_skip.txt -not -path './.venv/*' -print -quit)
            if [ -n "$skip_file" ]; then
              skip_args="--skip $(grep -v '^\s*#' "$skip_file" | grep -v '^\s*$' | tr '\n' ' ')"
            fi
            # shellcheck disable=SC2086
            uv run python build_cell.py all_cells $skip_args || return 1
            mkdir -p build/lyrdb
            project=()
            if [ -n "${DRC_PROJECT:-}" ]; then project=(--project "$DRC_PROJECT"); fi
            uv run gfp check drc build/gds/all_cells.gds "${project[@]}" \
              --outpath build/lyrdb/all_cells.lyrdb 2>&1 | tee build/drc.log
            drc_status=${PIPESTATUS[0]}
            mkdir -p "$base_dir"
            cp build/lyrdb/all_cells.lyrdb "$base_dir/" 2>/dev/null || true
            cp build/gds/all_cells.gds "$base_dir/" 2>/dev/null || true
            cp build/drc.log "$base_dir/" 2>/dev/null || true
            if [ ! -s "$base_dir/all_cells.lyrdb" ]; then
              echo "Base DRC produced no report (gfp exit ${drc_status})."
              return 1
            fi
          }

          if [ ! -s "$head_dir/all_cells.lyrdb" ]; then
            echo "Head DRC report is missing; not running DRC on the base."
          else
            # set +e around the call: a base failure must not hide the head result.
            set +e
            run_base
            echo "Base DRC comparison exited $?"
            set -e
          fi
          publish
          # Heredoc terminator has to sit at the script's left edge, so this
          # redaction stays outside run_base.
          if [ -f build/drc-compare/drc_base.log ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path

          api_key = os.environ.get("GFP_API_KEY", "").encode()
          log = Path("build/drc-compare/drc_base.log")
          if api_key and log.is_file():
              log.write_bytes(log.read_bytes().replace(api_key, b"***"))
          PY
          fi
          # The project environment has klayout (via gdsfactory), which
          # drc_delta.py uses to say which layout each error sits in. Without
          # it the comment still lists the categories.
          py=(python3)
          if uv run --no-sync python -c "import klayout.db" 2>/dev/null; then
            py=(uv run --no-sync python)
          fi
          "${py[@]}" drc_delta.py \
            --base build/drc-compare/all_cells_base.lyrdb \
            --head build/lyrdb/all_cells.lyrdb \
            --base-gds build/drc-compare/all_cells_base.gds \
            --head-gds build/gds/all_cells.gds \
            --out build/drc-compare/drc-delta.md
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat build/drc-compare/drc-delta.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload DRC report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drc-report
          path: |
            build/lyrdb/
            build/gds/all_cells.gds
            build/drc.log
          retention-days: 3
      - name: Upload base DRC comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drc-base-comparison
          path: build/drc-compare/
          retention-days: 3
          if-no-files-found: warn
      - name: Create DRC badge
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          value = "unavailable"
          color = "#9f9f9f"
          try:
              report = ET.parse("build/lyrdb/all_cells.lyrdb").getroot()
              items = report.find("items")
              if report.tag != "report-database" or items is None:
                  raise ValueError("Unexpected DRC report structure")
              count = len(items.findall("item"))
              value = str(count)
              color = "#4c1" if count == 0 else "#e05d44"
          except (OSError, ET.ParseError, ValueError):
              print("::error::DRC report is missing or invalid; no violation count is available.")

          label_width = 80
          value_width = max(34, len(value) * 7 + 12)
          width = label_width + value_width
          value_x = label_width + value_width / 2
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="20" role="img" aria-label="DRC errors: {value}">
            <rect width="{width}" height="20" rx="3" fill="#555"/>
            <path d="M{label_width} 0h{value_width}v20H{label_width}z" fill="{color}"/>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="40" y="14">DRC errors</text>
              <text x="{value_x}" y="14">{value}</text>
            </g>
          </svg>'''
          Path("badges").mkdir(exist_ok=True)
          Path("badges/drc.svg").write_text(svg, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### DRC\n\nViolation count: **{value}**.\n")
          raise SystemExit(1 if value == "unavailable" else 0)
          PY
      - name: Comment on DRC error change
        # A pull_request run from a fork gets a read-only token, so the comment
        # would fail; the artifact still holds the comparison.
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker="<!-- drc-delta -->"
          {
            echo "$marker"
            if [ -f build/drc-compare/drc-delta.md ]; then
              cat build/drc-compare/drc-delta.md
            else
              echo "## DRC error change"
              echo
              echo "Comparison did not run."
            fi
          } > comment.md

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\")) | .id] | first // empty")
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@comment.md > /dev/null
            echo "Updated comment $existing"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@comment.md > /dev/null
            echo "Posted a new comment"
          fi
      - name: Commit DRC badge
        # Pull requests report a delta in the comment above. Publishing the
        # badge from a PR would replace the default-branch count.
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ ! -f badges/drc.svg ]; then
            echo "::error::DRC badge generation did not produce an SVG."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tmp=$(mktemp -d)
          cp badges/drc.svg "$tmp/"

          # Clean untracked files so branch checkout succeeds
          git clean -fd
          git checkout -f .

          for attempt in 1 2 3; do
            git fetch origin badges 2>/dev/null || true
            if git rev-parse --verify origin/badges >/dev/null 2>&1; then
              git checkout -f -B badges origin/badges
            else
              git checkout --orphan badges
              git rm -rf . 2>/dev/null || true
            fi

            cp "$tmp"/drc.svg .
            git add drc.svg
            git diff --cached --quiet && echo "No DRC badge changes" && exit 0
            git commit -m "Update DRC badge [skip ci]"
            git push origin badges && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep 5
          done
          echo "All push attempts failed" && exit 1
