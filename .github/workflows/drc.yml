name: DRC Check
on:
  workflow_call:
    secrets:
      GFP_API_KEY:
        required: false
env:
  GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-drc
  cancel-in-progress: true
jobs:
  drc:
    name: DRC all_cells
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras -P gdsfactoryplus
      - name: Configure gfp
        run: uv run gfp configure --api-key ${{ secrets.GFP_API_KEY }} --uv
      - name: Download build_cell script
        run: |
          curl -fsSL "https://raw.githubusercontent.com/doplaydo/pdk-ci-workflow-public/main/scripts/build_cell.py" \
            -o build_cell.py
      - name: Build cell
        run: |
          SKIP_ARGS=""
          SKIP_FILE=$(find . -name build_cell_skip.txt -not -path './.venv/*' -print -quit)
          if [ -n "$SKIP_FILE" ]; then
            SKIP_ARGS="--skip $(grep -v '^\s*#' "$SKIP_FILE" | grep -v '^\s*$' | tr '\n' ' ')"
          fi
          uv run python build_cell.py all_cells $SKIP_ARGS
      - name: Run DRC
        shell: bash
        run: |
          mkdir -p build/lyrdb
          set +e
          uv run gfp check drc build/gds/all_cells.gds --outpath build/lyrdb/all_cells.lyrdb 2>&1 | tee build/drc.log
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${statuses[0]}" -ne 0 ]; then
            echo "::error::DRC command exited with code ${statuses[0]}. See build/drc.log in the drc-report artifact."
          fi
          if [ ! -s build/lyrdb/all_cells.lyrdb ]; then
            echo "::error::DRC produced no report; the violation count is unavailable."
            exit 1
          fi
          if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - name: Redact DRC log
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          api_key = os.environ.get("GFP_API_KEY", "").encode()
          log = Path("build/drc.log")
          if api_key and log.is_file():
              log.write_bytes(log.read_bytes().replace(api_key, b"***"))
          PY
      - name: Upload DRC report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drc-report
          path: |
            build/lyrdb/
            build/gds/all_cells.gds
            build/drc.log
          retention-days: 3
      - name: Create DRC badge
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          value = "unavailable"
          color = "#9f9f9f"
          try:
              report = ET.parse("build/lyrdb/all_cells.lyrdb").getroot()
              items = report.find("items")
              if report.tag != "report-database" or items is None:
                  raise ValueError("Unexpected DRC report structure")
              count = len(items.findall("item"))
              value = str(count)
              color = "#4c1" if count == 0 else "#e05d44"
          except (OSError, ET.ParseError, ValueError):
              print("::error::DRC report is missing or invalid; no violation count is available.")

          label_width = 80
          value_width = max(34, len(value) * 7 + 12)
          width = label_width + value_width
          value_x = label_width + value_width / 2
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="20" role="img" aria-label="DRC errors: {value}">
            <rect width="{width}" height="20" rx="3" fill="#555"/>
            <path d="M{label_width} 0h{value_width}v20H{label_width}z" fill="{color}"/>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="40" y="14">DRC errors</text>
              <text x="{value_x}" y="14">{value}</text>
            </g>
          </svg>'''
          Path("badges").mkdir(exist_ok=True)
          Path("badges/drc.svg").write_text(svg, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### DRC\n\nViolation count: **{value}**.\n")
          raise SystemExit(1 if value == "unavailable" else 0)
          PY
      - name: Commit DRC badge
        if: always()
        run: |
          if [ ! -f badges/drc.svg ]; then
            echo "::error::DRC badge generation did not produce an SVG."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tmp=$(mktemp -d)
          cp badges/drc.svg "$tmp/"

          # Clean untracked files so branch checkout succeeds
          git clean -fd
          git checkout -f .

          for attempt in 1 2 3; do
            git fetch origin badges 2>/dev/null || true
            if git rev-parse --verify origin/badges >/dev/null 2>&1; then
              git checkout -f -B badges origin/badges
            else
              git checkout --orphan badges
              git rm -rf . 2>/dev/null || true
            fi

            cp "$tmp"/drc.svg .
            git add drc.svg
            git diff --cached --quiet && echo "No DRC badge changes" && exit 0
            git commit -m "Update DRC badge [skip ci]"
            git push origin badges && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep 5
          done
          echo "All push attempts failed" && exit 1
