name: Test Coverage
on:
  workflow_call:
    secrets:
      GFP_API_KEY:
        required: false
env:
  GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
# No permissions block: the token is whatever the caller grants. Asking for
# more than an older wrapper grants would stop the run from starting.
concurrency:
  # A workflow_run event always carries the default branch as its ref, so key
  # on the Test code run being reported; a ref-keyed group would let reports
  # for different PRs cancel each other.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.ref }}-test_coverage
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      # The template triggers on workflow_run after Test code, which uploads
      # coverage.xml from its own pytest run. Nothing is re-run here.
      - name: Download coverage report from Test code
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Test code only uploads coverage-xml once `make test` has passed, so
          # the artifact's presence is the gate. The run's overall conclusion is
          # not: an unrelated job failing must not hide the coverage report.
          if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name coverage-xml --dir .; then
            echo "::warning::Test code run $RUN_ID has no coverage-xml artifact"
          fi

      # Transition path for repos whose test_coverage.yml wrapper still
      # triggers on pull_request/push: run the suite with coverage here, as
      # before. Remove once every PDK repo has the workflow_run wrapper.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_run'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: github.event_name != 'workflow_run'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: github.event_name != 'workflow_run'
        run: make install
      - name: Detect package name
        id: pkg
        if: github.event_name != 'workflow_run'
        shell: uv run python {0}
        run: |
          import tomllib, os
          with open("pyproject.toml", "rb") as f:
              cfg = tomllib.load(f)
          module = cfg.get("tool", {}).get("gdsfactoryplus", {}).get("pdk", {}).get("name", "")
          pkg = module.split(".")[0] if module else ""
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"name={pkg}\n")
      - name: Run tests with coverage
        if: github.event_name != 'workflow_run'
        env:
          PYTEST_ADDOPTS: "--cov=${{ steps.pkg.outputs.name }} --cov-report=term-missing --cov-report=xml --cov-append -q"
        run: make test

      - name: Write summary
        if: always()
        shell: python3 {0}
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          import xml.etree.ElementTree as ET, os
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          source = ""
          if os.environ.get("RUN_URL"):
              sha = os.environ.get("HEAD_SHA", "")[:7]
              branch = os.environ.get("HEAD_BRANCH", "")
              source = f"From [Test code]({os.environ['RUN_URL']}) on `{branch}` at `{sha}`.\n\n"
          try:
              tree = ET.parse("coverage.xml")
              rate = float(tree.getroot().attrib.get("line-rate", 0)) * 100
              text = f"Line coverage: {rate:.1f}%"
          except Exception as e:
              text = f"No coverage report available ({e})"
          with open(summary, "a") as f:
              f.write(f"## Test Coverage\n\n{source}{text}\n")
          print(text)

      # A workflow_run job never shows up on the PR it reports on, yet PDK
      # rulesets require `coverage / coverage` there. Post that context as a
      # commit status on the tested head SHA so the PR is not left waiting.
      - name: Report coverage status on the tested commit
        if: always() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # coverage-xml only exists once `make test` passed, so a report means
          # success. Without one, mirror Test code: a green run with nothing to
          # report (e.g. no PDK name) passes, anything else fails.
          if [ -f coverage.xml ]; then
            state=success
            desc=$(python3 -c 'import xml.etree.ElementTree as E; print("Line coverage: %.1f%%" % (float(E.parse("coverage.xml").getroot().get("line-rate", 0)) * 100))') ||
              desc="Coverage report unreadable"
          elif [ "$CONCLUSION" = "success" ]; then
            state=success
            desc="No coverage report from Test code"
          else
            state=failure
            desc="Test code $CONCLUSION, no coverage report"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context="coverage / coverage" \
            -f description="$desc" -f target_url="$TARGET_URL" > /dev/null ||
            echo "::warning::Could not post the coverage status; the wrapper must grant statuses: write"
