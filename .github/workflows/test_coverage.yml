name: Test Coverage
on:
  workflow_call:
    secrets:
      # No longer used. Kept so callers that still pass it don't fail.
      GFP_API_KEY:
        required: false
# No permissions block: the token is whatever the caller grants. The Test code
# template grants this job `contents: read` only; downloading an artifact of
# the same run needs no token scope at all.
concurrency:
  # A workflow_run event always carries the default branch as its ref, so key
  # on the Test code run being reported; a ref-keyed group would let reports
  # for different PRs cancel each other.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.ref }}-test_coverage
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      # The Test code template calls this as its `coverage` job with
      # `needs: test`, so the required `coverage / coverage` check is a job of
      # the same run. test_code uploads coverage-xml only after `make test`
      # has passed, so the artifact's presence is the test gate.
      - name: Download coverage report from test_code
        id: download
        if: github.event_name != 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-xml

      # Transition path for repos whose test_coverage.yml wrapper still
      # triggers on workflow_run of Test code. check-template-drift deletes
      # that wrapper on the next sync; remove this step and the status post
      # below once no PDK repo carries it.
      - name: Download coverage report from the Test code run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name coverage-xml --dir .; then
            echo "::warning::Test code run $RUN_ID has no coverage-xml artifact"
          fi

      - name: Check coverage report
        if: always()
        shell: python3 {0}
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          import os, sys
          import xml.etree.ElementTree as ET

          legacy = os.environ.get("GITHUB_EVENT_NAME") == "workflow_run"
          source = ""
          if os.environ.get("RUN_URL"):
              sha = os.environ.get("HEAD_SHA", "")[:7]
              branch = os.environ.get("HEAD_BRANCH", "")
              source = f"From [Test code]({os.environ['RUN_URL']}) on `{branch}` at `{sha}`.\n\n"
          ok = False
          if not os.path.exists("coverage.xml"):
              text = (
                  "No coverage report: test_code uploaded no coverage-xml artifact. "
                  "Its tests failed or did not run, or coverage was disabled "
                  "(see the test_code job's warnings)."
              )
              if os.environ.get("DOWNLOAD_OUTCOME") == "failure":
                  # download-artifact fails both for a missing artifact and
                  # for API/network errors; its log tells them apart.
                  text += (
                      " The download step failed; if test_code did upload "
                      "coverage-xml, check that step's log for an API or network error."
                  )
          else:
              try:
                  root = ET.parse("coverage.xml").getroot()
                  if root.tag != "coverage":
                      raise ValueError(f"root element is <{root.tag}>, not <coverage>")
                  rate = float(root.attrib["line-rate"])
                  if not 0.0 <= rate <= 1.0:
                      raise ValueError(f"line-rate {rate} is outside [0, 1]")
              except Exception as e:
                  text = f"Invalid coverage report ({type(e).__name__}: {e})"
              else:
                  text = f"Line coverage: {rate * 100:.1f}%"
                  ok = True
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write(f"## Test Coverage\n\n{source}{text}\n")
          if ok:
              print(text)
          elif legacy:
              # On the transition path the verdict travels in the commit
              # status below; this run is attached to the default branch.
              print(f"::warning::{text}")
          else:
              print(f"::error::{text}")
              sys.exit(1)

      # Transition path only, see above: a workflow_run job never shows up on
      # the PR it reports on, so the legacy wrapper posts the required context
      # as a commit status on the tested head SHA.
      - name: Report coverage status on the tested commit
        if: always() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # coverage-xml only exists once `make test` passed, so a report means
          # success. Without one, mirror Test code: a green run with nothing to
          # report (e.g. no PDK name) passes, anything else fails.
          if [ -f coverage.xml ]; then
            state=success
            desc=$(python3 -c 'import xml.etree.ElementTree as E; print("Line coverage: %.1f%%" % (float(E.parse("coverage.xml").getroot().get("line-rate", 0)) * 100))') ||
              desc="Coverage report unreadable"
          elif [ "$CONCLUSION" = "success" ]; then
            state=success
            desc="No coverage report from Test code"
          else
            state=failure
            desc="Test code $CONCLUSION, no coverage report"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context="coverage / coverage" \
            -f description="$desc" -f target_url="$TARGET_URL" > /dev/null ||
            echo "::warning::Could not post the coverage status; the wrapper must grant statuses: write"
