name: Generate nyanlib

on:
  workflow_call:
    inputs:
      gfp_image:
        description: 'gfp-server container image'
        required: false
        type: string
        default: 'ghcr.io/doplaydo/gfp-server:dev'
      timeout:
        description: >-
          Timeout in seconds, reused across phases: server startup, each
          resolveFactories batch call, and the Phase 4 drain wait.
        required: false
        type: number
        default: 3600
      script_ref:
        description: >-
          Ref to fetch scripts/generate_nyanlib.py from. A reusable
          workflow's own github context always reflects the caller's ref,
          not its own (github.com/actions/toolkit#1264), so this can't be
          auto-detected - override it only when testing a change to this
          workflow file from a branch before merging, so the fetched script
          matches.
        required: false
        type: string
        default: 'main'
    secrets:
      GFP_API_KEY:
        required: false
      GFP_ECR_IMAGE:
        description: 'Full ECR image URI for gfp-server'
        required: true
      SHARED_SERVICES_AWS_OIDC_ROLE_ARN:
        description: 'IAM role ARN for OIDC-based ECR pull (gdsfactory-pull)'
        required: true

env:
  GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
  # Override symbol_pool_size() default of 2 (crates/gfp-server/src/worker/manager.rs)
  GFP_SYMBOL_WORKERS: '4'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      project-dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: find
        run: |
          dirs=$(find . -maxdepth 3 -name 'pyproject.toml' \
            -path '*--sample-projects/*' ! -path '*/.venv/*' \
            | sed 's|^\./||; s|/pyproject.toml||' \
            | sort \
            | jq -Rcs '[split("\n")[] | select(. != "")]')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  generate:
    name: Generate models.nyanlib + SVG symbols (${{ matrix.project-dir }})
    needs: discover
    if: needs.discover.outputs.project-dirs != '' && needs.discover.outputs.project-dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project-dir: ${{ fromJSON(needs.discover.outputs.project-dirs) }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-generate_nyanlib-${{ matrix.project-dir }}
      cancel-in-progress: true
    env:
      PROJECT_DIR: ${{ matrix.project-dir }}
      # The private GFP portal index shadows PyPI package names. uv's default
      # "first-index" strategy would refuse to fall back to PyPI, breaking
      # resolution of packages like doroutes and h5netcdf. Consider all indexes
      # so the correct versions are found wherever they live.
      UV_INDEX_STRATEGY: unsafe-best-match
    # Run inside the gfp-server image itself, matching gdsfactoryplus's own
    # documented consumption pattern (specs/container_publishing.md). /opt/gfp
    # in the image ships only libpython3.12.so, not a stdlib tree - the base
    # image (python:3.12-slim) is what supplies /usr/local/lib/python3.12.
    # Extracting just /opt/gfp onto a bare Ubuntu runner and pairing it with
    # an unrelated Python (system or uv-managed) fails identically either
    # way: ModuleNotFoundError: No module named '_csv' (#312), because no
    # externally-sourced Python is guaranteed ABI/layout-compatible with
    # gfp's bundled libpython. Running inside the image sidesteps the whole
    # class of mismatch - there's only one Python here.
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.SHARED_SERVICES_AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7
      
      - name: Pull gfp-server image
        run: docker pull "${{ secrets.GFP_ECR_IMAGE }}"

      - id: slug
        name: Compute project-dir slug
        run: |
          slug=$(echo "$PROJECT_DIR" | tr '/' '-' | sed 's/^-*//; s/-*$//')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - id: pdk-package
        name: Read PDK package name
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          print(f"package={pyproject['project']['name']}")
          PY


      - name: Download generate_nyanlib script
        env:
          SCRIPT_REF: ${{ inputs.script_ref }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/doplaydo/pdk-ci-workflow-public/$SCRIPT_REF/scripts/generate_nyanlib.py" \
            -o generate_nyanlib.py

      - name: Install PDK and generate nyanlib inside gfp-server
        env:
          PDK_PACKAGE: ${{ steps.pdk-package.outputs.package }}
          TIMEOUT: '${{ inputs.timeout }}'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e GFP_API_KEY \
            -e GFP_SYMBOL_WORKERS \
            -e UV_INDEX_STRATEGY \
            -e PROJECT_DIR \
            -e PDK_PACKAGE \
            -e TIMEOUT \
            "${{ secrets.GFP_ECR_IMAGE }}" \
            bash -c '
              set -euo pipefail
              apt-get update && apt-get install -y --no-install-recommends libexpat1 build-essential
              uv run --no-project --with gdsfactoryplus gfp configure --api-key "$GFP_API_KEY" --uv
              cd "$PROJECT_DIR"
              uv sync --no-sources-package "$PDK_PACKAGE"
              cd /workspace
              python3 generate_nyanlib.py \
                --gfp-bin "$(command -v gfp)" \
                --project-root "$PROJECT_DIR" \
                --timeout "$TIMEOUT"
            '
          # Fix file ownership so subsequent runner steps can read build output
          sudo chown -R "$(id -u):$(id -g)" "$PROJECT_DIR/build" 2>/dev/null || true

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nyanlib-server-log-${{ steps.slug.outputs.slug }}
          path: ${{ matrix.project-dir }}/build/server.log
          retention-days: 3

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nyanlib-${{ steps.slug.outputs.slug }}
          path: |
            ${{ matrix.project-dir }}/build/models.nyanlib
            ${{ matrix.project-dir }}/build/symbols/
          retention-days: 7

      - name: Open nyanlib update PR (manual dispatch only)
        # main is rule-protected org-wide: no direct push can land here, ever
        # (pull_request rule, required_approving_review_count: 1, no bypass
        # actor). Only run this on an explicit manual dispatch, not on every
        # push to main - a "regenerate nyanlib" PR needing human approval
        # after every commit would be spam, not a warm-start cache refresh.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$PROJECT_DIR/build/models.nyanlib"
          if [ -d "$PROJECT_DIR/build/symbols" ]; then
            git add -f "$PROJECT_DIR/build/symbols/"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          BRANCH="chore/update-nyanlib-${{ steps.slug.outputs.slug }}"
          git checkout -B "$BRANCH"
          git commit -m "chore: regenerate models.nyanlib and SVG symbols ($PROJECT_DIR)"
          git push -f origin "$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: regenerate models.nyanlib and SVG symbols ($PROJECT_DIR)" \
              --body "Automated nyanlib + SVG symbol regeneration for \`$PROJECT_DIR\`, triggered by manual workflow dispatch."
          else
            echo "PR already open: $existing"
          fi
