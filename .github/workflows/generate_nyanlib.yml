name: Generate nyanlib

on:
  workflow_call:
    inputs:
      gfp_image:
        description: 'gfp-server container image'
        required: false
        type: string
        default: 'ghcr.io/doplaydo/gfp-server:dev'
      timeout:
        description: >-
          Timeout in seconds, reused across phases: server startup, each
          resolveFactories batch call, and the Phase 4 drain wait.
        required: false
        type: number
        default: 3600
      filter_to_pdk:
        description: >-
          Resolve only factories owned by this PDK, skipping built-in
          gdsfactory cells and sample-project cells. Off by default:
          resolves every indexed factory, at the cost of a much longer run.
        required: false
        type: boolean
        default: false
      script_ref:
        description: >-
          Ref to fetch scripts/generate_nyanlib.py from. A reusable
          workflow's own github context always reflects the caller's ref,
          not its own (github.com/actions/toolkit#1264), so this can't be
          auto-detected - override it only when testing a change to this
          workflow file from a branch before merging, so the fetched script
          matches.
        required: false
        type: string
        default: 'main'
    secrets:
      GFP_API_KEY:
        required: false

env:
  GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
  # Override symbol_pool_size() default of 2 (crates/gfp-server/src/worker/manager.rs)
  GFP_SYMBOL_WORKERS: '4'

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-generate_nyanlib
  cancel-in-progress: true

jobs:
  generate:
    name: Generate models.nyanlib + SVG symbols
    runs-on: ubuntu-latest
    # Run inside the gfp-server image itself, matching gdsfactoryplus's own
    # documented consumption pattern (specs/container_publishing.md). /opt/gfp
    # in the image ships only libpython3.12.so, not a stdlib tree - the base
    # image (python:3.12-slim) is what supplies /usr/local/lib/python3.12.
    # Extracting just /opt/gfp onto a bare Ubuntu runner and pairing it with
    # an unrelated Python (system or uv-managed) fails identically either
    # way: ModuleNotFoundError: No module named '_csv' (#312), because no
    # externally-sourced Python is guaranteed ABI/layout-compatible with
    # gfp's bundled libpython. Running inside the image sidesteps the whole
    # class of mismatch - there's only one Python here.
    container:
      image: ${{ inputs.gfp_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install git, gh CLI, and build tools
        # python:3.12-slim ships none of these. git/gh are needed for the
        # script download and the PR-landing step below (actions/checkout
        # itself doesn't need git - it falls back to the REST API in a
        # git-less container). build-essential is needed because some PDK
        # dependencies have no wheel matching this exact Python build and
        # fall back to a source build (`No such file or directory: 'gcc'`
        # without it).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates gnupg build-essential
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y gh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install PDK
        run: uv sync

      - name: Download generate_nyanlib script
        env:
          SCRIPT_REF: ${{ inputs.script_ref }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/doplaydo/pdk-ci-workflow-public/$SCRIPT_REF/scripts/generate_nyanlib.py" \
            -o generate_nyanlib.py

      - name: Generate nyanlib
        env:
          FILTER_TO_PDK: ${{ inputs.filter_to_pdk }}
        run: |
          filter_flag=""
          if [ "$FILTER_TO_PDK" = "true" ]; then
            filter_flag="--filter-to-pdk"
          fi
          python3 generate_nyanlib.py \
            --gfp-bin "$(command -v gfp)" \
            --project-root . \
            --timeout ${{ inputs.timeout }} \
            $filter_flag

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nyanlib-server-log
          path: build/server.log
          retention-days: 3

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nyanlib
          path: |
            build/models.nyanlib
            build/symbols/
          retention-days: 7

      - name: Open nyanlib update PR (manual dispatch only)
        # main is rule-protected org-wide: no direct push can land here, ever
        # (pull_request rule, required_approving_review_count: 1, no bypass
        # actor). Only run this on an explicit manual dispatch, not on every
        # push to main - a "regenerate nyanlib" PR needing human approval
        # after every commit would be spam, not a warm-start cache refresh.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/models.nyanlib
          if [ -d build/symbols ]; then
            git add -f build/symbols/
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          BRANCH="chore/update-nyanlib"
          git checkout -B "$BRANCH"
          git commit -m "chore: regenerate models.nyanlib and SVG symbols"
          git push -f origin "$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: regenerate models.nyanlib and SVG symbols" \
              --body "Automated nyanlib + SVG symbol regeneration, triggered by manual workflow dispatch."
          else
            echo "PR already open: $existing"
          fi
